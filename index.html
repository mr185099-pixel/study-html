<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Study Files</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#101826;color:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 16px}
.wrap{max-width:560px;margin:auto}
.card{background:#fbf8f1;color:#1b2436;border-radius:18px;padding:26px 20px;box-shadow:0 12px 35px #0006}
.eyebrow{font-size:11px;letter-spacing:1.5px;color:#b98b2a;font-weight:700;margin-bottom:8px}
h1{margin:0 0 8px;font-size:27px}
p{color:#5b6577;line-height:1.6;margin:0 0 22px}
.file{display:flex;align-items:center;gap:12px;text-decoration:none;color:#1b2436;background:#fffdf8;border:1.5px solid #ddd3b8;border-radius:12px;padding:15px;margin-top:10px}
.icon{width:40px;height:40px;border-radius:10px;background:#1b2a4a;color:#f7f0da;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.name{font-weight:700;font-size:15px}
.type{font-size:12px;color:#7a8ca8;margin-top:3px}
.arrow{margin-left:auto;font-size:20px;color:#b98b2a}
.note{font-size:12px;color:#7a8ca8;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="eyebrow">📚 MY STUDY FILES</div>
    <h1>স্টাডি ফাইলস</h1>
    <p>নিচের ফাইলটিতে চাপ দিলে সরাসরি Safari-তে MCQ পরীক্ষা খুলবে।</p>

    <!-- নতুন HTML file যোগ করলে নিচের মতো আরেকটি .file block copy করে
         href-এ নতুন file-এর নাম এবং name-এ তার নাম বসিয়ে দেবে। -->

    <a class="file" href="vocab-mcq-exam-1.html">
      <div class="icon">📖</div>
      <div>
        <div class="name">Vocabulary MCQ Exam</div>
        <div class="type">HTML • Synonym Drill</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <div class="note">নতুন HTML file একই folder-এ upload করে উপরের মতো একটি link যোগ করুন।</div>
  </div>
</div>
</body>
</html>
