<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Study Files</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101826;color:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:28px 16px}.wrap{max-width:560px;margin:auto}.card{background:#fbf8f1;color:#1b2436;border-radius:18px;padding:26px 20px;box-shadow:0 12px 35px #0006}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#b98b2a;font-weight:700;margin-bottom:8px}h1{margin:0 0 8px;font-size:27px}p{color:#5b6577;line-height:1.6;margin:0 0 22px}.file{display:flex;align-items:center;gap:12px;text-decoration:none;color:#1b2436;background:#fffdf8;border:1.5px solid #ddd3b8;border-radius:12px;padding:15px;margin-top:10px}.icon{width:40px;height:40px;border-radius:10px;background:#1b2a4a;color:#f7f0da;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.name{font-weight:700;font-size:15px}.type{font-size:12px;color:#7a8ca8;margin-top:3px}.arrow{margin-left:auto;font-size:20px;color:#b98b2a}.status{padding:14px;border-radius:12px;background:#fffdf8;border:1px solid #ddd3b8;color:#657086;text-align:center}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="eyebrow">📚 MY STUDY FILES</div>
<h1>স্টাডি ফাইলস</h1>
<p>GitHub-এ নতুন HTML file upload করলেই এখানে automatically দেখা যাবে।</p>
<div id="files"><div class="status">Files loading...</div></div>
</div></div>
<script>
const owner="mr185099-pixel", repo="study-html";
function prettyName(n){return n.replace(/\.html$/i,"").replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/\b\w/g,c=>c.toUpperCase());}
async function loadFiles(){
 const box=document.getElementById("files");
 try{
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`,{cache:"no-store"});
  if(!r.ok) throw new Error();
  const files=await r.json();
  const htmlFiles=files.filter(f=>f.type==="file"&&/\.html$/i.test(f.name)&&f.name.toLowerCase()!=="index.html")
   .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"}));
  box.innerHTML=htmlFiles.length?htmlFiles.map(f=>`<a class="file" href="${encodeURI(f.name)}"><div class="icon">📖</div><div><div class="name">${prettyName(f.name)}</div><div class="type">HTML • Study File</div></div><div class="arrow">›</div></a>`).join(""):'<div class="status">কোনো HTML file পাওয়া যায়নি।</div>';
 }catch(e){box.innerHTML='<div class="status">Files load করা যাচ্ছে না। Refresh করে আবার চেষ্টা করুন।</div>';}
}
loadFiles();
</script>
</body>
</html>
